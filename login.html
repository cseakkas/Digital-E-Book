<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | Smart Education Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
        .auth-card { transition: all 0.5s ease-in-out; }
        .input-focus:focus-within { border-color: #2563eb; ring: 2px; ring-color: #bfdbfe; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Logo Section -->
    <div class="mb-8 text-center">
        <a href="index.html" class="flex items-center justify-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-200">
                <i class="fas fa-book-open text-white text-2xl"></i>
            </div>
            <span class="text-3xl font-bold text-blue-900">Smart<span class="text-blue-600">Edu</span></span>
        </a>
        <p class="text-slate-500 mt-2 font-medium">আপনার শেখার যাত্রা শুরু হোক এখান থেকেই</p>
    </div>

    <div class="w-full max-w-[450px] bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden auth-card">
        
        <!-- Toggle Tabs -->
        <div class="flex border-b border-slate-100">
            <button onclick="toggleAuth('login')" id="login-tab" class="flex-1 py-4 font-bold text-blue-600 border-b-2 border-blue-600 transition-all">লগইন</button>
            <button onclick="toggleAuth('register')" id="register-tab" class="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-all">নতুন অ্যাকাউন্ট</button>
        </div>

        <div class="p-8">
            <!-- Login Form -->
            <form id="login-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">ইমেইল বা মোবাইল নাম্বার</label>
                    <div class="relative flex items-center group">
                        <i class="fas fa-envelope absolute left-4 text-slate-400 group-focus-within:text-blue-600 transition"></i>
                        <input type="text" placeholder="example@email.com" 
                               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between">
                        <label class="text-sm font-semibold text-slate-700">পাসওয়ার্ড</label>
                        <a href="#" class="text-xs font-bold text-blue-600 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                    <div class="relative flex items-center group">
                        <i class="fas fa-lock absolute left-4 text-slate-400 group-focus-within:text-blue-600 transition"></i>
                        <input type="password" id="login-pass" placeholder="••••••••" 
                               class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                        <button type="button" onclick="togglePass('login-pass')" class="absolute right-4 text-slate-400 hover:text-slate-600">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <label for="remember" class="text-sm text-slate-600 cursor-pointer">লগইন তথ্য মনে রাখুন</label>
                </div>

                <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition duration-300">
                    লগইন করুন
                </button>
            </form>

            <!-- Register Form (Hidden initially) -->
            <form id="register-form" class="hidden space-y-5">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">পুরো নাম</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-user absolute left-4 text-slate-400"></i>
                        <input type="text" placeholder="যেমন: রাকিব আহমেদ" 
                               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">মোবাইল নাম্বার</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-phone absolute left-4 text-slate-400"></i>
                        <input type="tel" placeholder="০১৭XXXXXXXX" 
                               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">নতুন পাসওয়ার্ড</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-lock absolute left-4 text-slate-400"></i>
                        <input type="password" id="reg-pass" placeholder="কমপক্ষে ৮ ডিজিট" 
                               class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                        <button type="button" onclick="togglePass('reg-pass')" class="absolute right-4 text-slate-400">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="text-xs text-slate-500 leading-relaxed">
                    অ্যাকাউন্ট খোলার মাধ্যমে আপনি আমাদের <a href="#" class="text-blue-600 font-bold underline">টার্মস এন্ড কন্ডিশন</a> মেনে নিচ্ছেন।
                </div>

                <button type="submit" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition shadow-lg shadow-slate-200">
                    অ্যাকাউন্ট খুলুন
                </button>
            </form>

            <!-- Social Login -->
            <div class="mt-8 text-center space-y-4">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
                    <span class="relative px-4 bg-white text-xs font-semibold text-slate-400 uppercase tracking-widest">অথবা</span>
                </div>

                <div class="flex gap-4">
                    <button class="flex-1 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition flex items-center justify-center space-x-2">
                        <img src="https://www.svgrepo.com/show/355037/google.svg" class="w-5 h-5">
                        <span class="text-sm font-bold text-slate-700">Google</span>
                    </button>
                    <button class="flex-1 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition flex items-center justify-center space-x-2">
                        <i class="fab fa-facebook text-blue-600 text-xl"></i>
                        <span class="text-sm font-bold text-slate-700">Facebook</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleAuth(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTab.className = "flex-1 py-4 font-bold text-blue-600 border-b-2 border-blue-600 transition-all";
                registerTab.className = "flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTab.className = "flex-1 py-4 font-bold text-blue-600 border-b-2 border-blue-600 transition-all";
                loginTab.className = "flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-all";
            }
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            const icon = event.currentTarget.querySelector('i');
            if (input.type === "password") {
                input.type = "text";
                icon.className = "far fa-eye-slash";
            } else {
                input.type = "password";
                icon.className = "far fa-eye";
            }
        }
    </script>
</body>
</html>
