<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট | Smart Education Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-[400px] bg-white rounded-3xl border border-slate-200 shadow-xl p-8 text-center">
        <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-key text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">পাসওয়ার্ড ভুলে গেছেন?</h2>
        <p class="text-slate-500 mb-8">চিন্তা করবেন না! আপনার ইমেইল দিন, আমরা একটি রিসেট লিঙ্ক পাঠিয়ে দিচ্ছি।</p>

        <form class="space-y-6 text-left">
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">আপনার ইমেইল</label>
                <input type="email" required placeholder="example@email.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
            </div>
            <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition">লিঙ্ক পাঠান</button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <a href="login.html" class="text-sm font-bold text-blue-600 hover:text-blue-700">
                <i class="fas fa-arrow-left mr-2"></i> লগইন পেইজে ফিরে যান
            </a>
        </div>
    </div>
</body>
</html>
