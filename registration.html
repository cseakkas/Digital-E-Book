<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিবন্ধন করুন | Smart Education Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="mb-6 text-center">
        <a href="index.html" class="flex items-center justify-center space-x-2">
            <div class="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-200">
                <i class="fas fa-book-open text-white text-2xl"></i>
            </div>
            <span class="text-3xl font-bold text-blue-900">Smart<span class="text-blue-600">Edu</span></span>
        </a>
    </div>

    <div class="w-full max-w-[500px] bg-white rounded-3xl border border-slate-200 shadow-xl p-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">নতুন অ্যাকাউন্ট তৈরি করুন</h2>
        <p class="text-slate-500 mb-8">আপনার তথ্য দিয়ে ফরমটি পূরণ করুন।</p>

        <form class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">নাম</label>
                    <input type="text" placeholder="রাকিব আহমেদ" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                </div>
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">মোবাইল</label>
                    <input type="tel" placeholder="০১৭XXXXXXXX" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">ইমেইল</label>
                <input type="email" placeholder="example@gmail.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
            </div>

            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">পাসওয়ার্ড</label>
                <input type="password" placeholder="কমপক্ষে ৮ ডিজিট" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
            </div>

            <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition">নিবন্ধন সম্পন্ন করুন</button>
        </form>

        <p class="mt-8 text-center text-slate-600">আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html" class="text-blue-600 font-bold">লগইন করুন</a></p>
    </div>
</body>
</html>
