<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড পরিবর্তন | Smart Education Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-[420px] bg-white rounded-3xl border border-slate-200 shadow-xl p-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">নতুন পাসওয়ার্ড সেট করুন</h2>
        <p class="text-slate-500 mb-8">নিরাপত্তার জন্য একটি শক্তিশালী পাসওয়ার্ড ব্যবহার করুন।</p>

        <form class="space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">নতুন পাসওয়ার্ড</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
            </div>
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-700">পাসওয়ার্ড নিশ্চিত করুন</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-600 transition">
            </div>
            <button type="submit" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition">পাসওয়ার্ড আপডেট করুন</button>
        </form>
    </div>
</body>
</html>
